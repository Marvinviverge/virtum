[package]
name = "virtum"
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://virtum.dev"
repository = "https://github.com/Marvinviverge/virtum"

[dependencies]
anyhow = "1"
jiff = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = { version = "2.1", default-features = false, features = ["serialize", "deserialize"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "signal"] }
uuid = { version = "1", features = ["v4"] }

# Binaire de release sans symboles : plus petit, et attendu dans un paquet Debian.
[profile.release]
strip = true
