# Contrôles à chaque PR et à chaque push sur master : format, clippy, tests, dépendances.
# Les tests avec de vraies VM (libvirt, KVM) restent manuels : scripts/smoke-test-lab*.sh.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# Jeton en lecture seule : le workflow ne publie rien.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions épinglées par empreinte de commit (un tag peut être déplacé).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version épinglée dans rust-toolchain.toml (la même qu'en local).
      - name: Toolchain Rust
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy && rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Le test de lecture seule sous bubblewrap s'exécute si l'hôte l'autorise, sinon il est sauté.
      - name: bubblewrap
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: TMPDIR="$(mktemp -d)" cargo test --locked

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit,cargo-deny

      # Vulnérabilités connues (RustSec), ignores éventuels dans .cargo/audit.toml.
      - name: cargo audit
        run: cargo audit

      # Crates non maintenues, doublons interdits, sources hors crates.io.
      - name: cargo deny
        run: cargo deny check advisories bans sources
