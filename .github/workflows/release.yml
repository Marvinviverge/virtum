# Release : à chaque tag vX.Y.Z, construit le binaire Linux, l'archive, le paquet .deb,
# SHA256SUMS et une attestation de provenance, puis crée la release GitHub en brouillon.
# Le brouillon est relu puis publié à la main.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Construit sur Ubuntu 22.04 (glibc 2.35) : le binaire tourne sur Debian 12 et
    # Ubuntu 22.04 ou plus récents.
    container: ubuntu:22.04
    permissions:
      contents: write # créer la release
      id-token: write # signer l'attestation
      attestations: write
    steps:
      - name: Outils de build
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates curl git gcc libc6-dev qemu-utils openssh-client
          # gh pour créer la release (dépôt officiel de GitHub CLI).
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update -q && apt-get install -y -q gh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Toolchain Rust (version de rust-toolchain.toml)
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          "$HOME/.cargo/bin/rustup" toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Le tag correspond à Cargo.toml
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, Cargo.toml $v"; exit 1; }

      - name: Tests
        run: TMPDIR="$(mktemp -d)" cargo test --locked --release

      - name: Build
        run: cargo build --locked --release

      - name: Archive
        run: scripts/package-release.sh target/release/virtum dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb

      - name: Release en brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[?" v "\\]?" {p=1; next} /^## /{p=0} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "Pas de section $v dans CHANGELOG.md"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.deb dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Virtum $v" --notes-file notes.md
